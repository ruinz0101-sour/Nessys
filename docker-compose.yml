services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: nas-laravel:production
    container_name: nas-app
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stack
      LOG_LEVEL: error
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: nasdb
      DB_USERNAME: postgres
      DB_PASSWORD: sxnx
      AUTO_MIGRATE: "true"
      TZ: Asia/Bangkok
    volumes:
      - ./app:/var/www/html/app
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./resources:/var/www/html/resources
      - ./database:/var/www/html/database
      - laravel_public:/var/www/html/public
      - laravel_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nas-network

  nginx:
    image: nginx:1.27-alpine
    container_name: nas-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - laravel_public:/var/www/html/public:ro
      - laravel_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - nas-network

  postgres:
    image: postgres:16
    container_name: nas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nasdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sxnx
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nasdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nas-network

networks:
  nas-network:
    driver: bridge

volumes:
  postgres_data:
  laravel_public:
  laravel_storage:
